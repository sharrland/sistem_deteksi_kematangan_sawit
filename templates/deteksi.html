<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deteksi Sawit</title>
    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial;
        }
        body{
            background:#f5f5f5;
        }

        /* NAVBAR */
        nav{
            width:100%;
            background:#14532d;
            display:flex;
            justify-content:space-between;
            align-items:center;
            padding:20px 8%;
        }
        .logo-area{
            display:flex;
            align-items:center;
            gap:10px;
        }
        .logo-area img{
            width:45px;
        }
        .logo-area h2{
            color:white;
        }
        .menu a{
            color:white;
            text-decoration:none;
            margin-left:20px;
            padding:10px 20px;
            border-radius:10px;
            font-size:18px;
            transition:0.3s;
        }
        .menu a:hover,
        .active{
            background:#22c55e;
        }

        /* CONTAINER  */
        .container{
            width:92%;
            margin:35px auto;
        }
        .container h1{
            text-align:center;
            color:#14532d;
            margin-bottom:35px;
            font-size:38px;
        }

        /*  CARD  */
        .card{
            background:white;
            border-radius:25px;
            padding:45px;
            margin-bottom:35px;
            min-height:78vh;
            display:flex;
            flex-direction:column;
            justify-content:center;
        }

        /* UPLOAD BOX */
        .upload-box{
            background:#ecfdf5;
            border:3px dashed #22c55e;
            border-radius:25px;
            min-height:260px;
            display:flex;
            flex-direction:column;
            justify-content:center;
            align-items:center;
            text-align:center;
            padding:30px;
        }

        /* Icon Upload */
        .upload-icon{
            width:75px;
            height:75px;
            background:#d1fae5;
            border-radius:50%;
            display:flex;
            justify-content:center;
            align-items:center;
            font-size:32px;
            color:#22c55e;
            margin-bottom:20px;
        }

        /* Text */
        .upload-box h2{
            color:#666;
            font-size:22px;
            margin-bottom:12px;
            line-height:1.5;
        }
        .upload-box p{
            color:#888;
            font-size:16px;
            margin-bottom:25px;
        }

        /* Hide Input */
        #imageInput{
            display:none;
        }

        /* Upload Button */
        .upload-btn{
            background:#22c55e;
            color:white;
            padding:14px 30px;
            border-radius:12px;
            cursor:pointer;
            font-size:18px;
            transition:0.3s;
        }
        .upload-btn:hover{
            background:#15803d;
        }

        /* Preview File */
        .file-preview{
            display:none;
            align-items:center;
            gap:12px;
            background:white;
            padding:12px 20px;
            border-radius:15px;
            margin-top:20px;
        }
        .file-name{
            color:#14532d;
            font-size:17px;
            font-weight:bold;
        }

        /* Remove Button */
        .remove-btn{
            background:red;
            color:white;
            border:none;
            width:28px;
            height:28px;
            border-radius:50%;
            cursor:pointer;
            font-size:16px;
        }

        /* Detect Button */
        .detect-btn{
            display:none;
            margin-top:25px;
            background:#22c55e;
            color:white;
            border:none;
            padding:14px 30px;
            border-radius:12px;
            font-size:18px;
            cursor:pointer;
            transition:0.3s;
        }
        .detect-btn:hover{
            background:#15803d;
        }

        /*  RESULT CARD  */
        .result-card{
            display:none;
            background:white;
            border-radius:25px;
            padding:45px;
            border:2px solid #14532d;
            min-height:78vh;
            justify-content:center;
        }

        /* Title */
        .result-title{
            text-align:center;
            font-size:38px;
            color:#14532d;
            margin-bottom:45px;
        }

        /* Content */
        .result-content{
            display:flex;
            justify-content:space-between;
            align-items:center;
            gap:60px;
            flex-wrap:wrap;
        }

        /* Left Text */
        .result-text{
            flex:1;
        }
        .result-text p{
            font-size:28px;
            color:#222;
            margin-bottom:12px;
        }
        .result-text span{
            color:#14532d;
            font-weight:bold;
        }

        /* Image */
        .result-image{
            width:320px;
            height:320px;
            background:#d1d5db;
            border-radius:15px;
            overflow:hidden;
            display:flex;
            justify-content:center;
            align-items:center;
        }

        .result-image img{
            width:100%;
            height:100%;
            object-fit:cover;
        }

        /* RESPONSIVE  */
        @media(max-width:768px){
            nav{
                flex-direction:column;
                gap:20px;
            }
            .card,
            .result-card{
                padding:25px;
            }
            .container h1{
                font-size:30px;
            }
            .upload-box{
                min-height:230px;
                padding:25px;
            }
            .upload-box h2{
                font-size:18px;
            }
            .result-content{
                flex-direction:column;
            }
            .result-title{
                font-size:28px;
            }
            .result-text p{
                font-size:22px;
            }
            .result-image{
                width:100%;
                height:300px;
            }
        }
    </style>
</head>
<body>

    <!-- NAVBAR  -->
    <nav>
        <div class="logo-area">
            <img src="{{ url_for('static', filename='Logo Sawit.png') }}">
            <h2>Sistem Deteksi Kematangan Sawit</h2>
        </div>
        <div class="menu">
            <a href="/">Beranda</a>
            <a href="/deteksi" class="active">Deteksi</a>
            <a href="/tentang">Tentang</a>
        </div>
    </nav>

    <!--  CONTAINER  -->
    <div class="container">

        <!--  UPLOAD CARD  -->
        <div class="card">
            <h1>Upload Gambar Sawit</h1>
            <div class="upload-box">

                <!-- Icon -->
                <div class="upload-icon">
                    ⬆
                </div>

                <!-- Text -->
                <h2>
                    Unggah gambar buah kelapa sawit
                    untuk mendeteksi tingkat kematangannya
                </h2>
                <p>
                    Format: JPG, PNG — maks. 5 MB
                </p>

                <!-- Input File -->
                <input
                    type="file"
                    id="imageInput"
                    accept="image/*"
                >

                <!-- Upload Button -->
                <label
                    for="imageInput"
                    class="upload-btn"
                    id="uploadLabel"
                >
                    Unggah Gambar
                </label>

                <!-- Preview Nama File -->
                <div
                    class="file-preview"
                    id="filePreview"
                >
                    <span
                        class="file-name"
                        id="fileName"
                    >
                    </span>

                    <!-- Remove -->
                    <button
                        class="remove-btn"
                        onclick="removeImage()"
                    >
                        ×
                    </button>
                </div>

                <!-- Detect Button -->
                <button
                    class="detect-btn"
                    id="detectBtn"
                    onclick="detectImage()"
                >
                    Deteksi Sekarang
                </button>
            </div>
        </div>

        <!--  RESULT CARD -->
        <div
            class="result-card"
            id="result"
        >
            <h2 class="result-title">
                Hasil Deteksi Tingkat Kematangan
            </h2>
            <div class="result-content">

                <!-- Text -->
                <div class="result-text">
                    <p> Status: </p>
                    <p> <span id="hasil"></span> </p>
                    <br>

                    <p> Confidence: </p>
                    <p> <span id="confidence"></span> </p>
                    <br>

                    <p> Keterangan: </p>
                    <p> <span id="deskripsi"></span> </p>
                </div>

                <!-- Image -->
                <div class="result-image">
                    <img id="preview">
                </div>
            </div>
        </div>
    </div>

    <!--  JAVASCRIPT  -->
    <script>
        const imageInput =
        document.getElementById('imageInput')

        const uploadLabel =
        document.getElementById('uploadLabel')

        const filePreview =
        document.getElementById('filePreview')

        const fileName =
        document.getElementById('fileName')

        const detectBtn =
        document.getElementById('detectBtn')

        /*  UPLOAD IMAGE  */
        imageInput.addEventListener('change', function(){
            const file = this.files[0]
            if(file){

                /* tampilkan nama file */
                fileName.innerHTML = file.name

                /* tampilkan preview file */
                filePreview.style.display = 'flex'

                /* hilangkan tombol upload */
                uploadLabel.style.display = 'none'

                /* tampilkan tombol deteksi */
                detectBtn.style.display = 'inline-block'
            }
        })

        /* REMOVE IMAGE */
        function removeImage(){
            imageInput.value = ''
            filePreview.style.display = 'none'
            uploadLabel.style.display = 'inline-block'
            detectBtn.style.display = 'none'
            document.getElementById('result').style.display = 'none'
        }

        /*  DETECT IMAGE */
        function detectImage(){
            let file = imageInput.files[0]
            if(!file){
                alert('Pilih gambar terlebih dahulu')
                return
            }
            let formData = new FormData()
            formData.append('file', file)
            fetch('/deteksi', {
                method:'POST',
                body:formData
            })
            .then(response => response.json())
            .then(data => {

                /* tampilkan hasil */
                document.getElementById('result').style.display = 'block'

                /* preview image */
                document.getElementById('preview').src =
                URL.createObjectURL(file)

                /* hasil klasifikasi */
                document.getElementById('hasil').innerHTML =
                data.hasil

                /* confidence */
                document.getElementById('confidence').innerHTML =
                data.confidence + '%'

                /* deskripsi */
                document.getElementById('deskripsi').innerHTML =
                data.deskripsi

                /* scroll ke hasil */
                document.getElementById('result')
                .scrollIntoView({
                    behavior:'smooth'
                })
            })
        }
    </script>
</body>
</html>
